[package]
name = "jarvis"
version = "0.1.0"
description = "JARVIS desktop shell (Tauri 2)"
authors = ["JARVIS contributors"]
edition = "2021"

# This library is what the desktop binary links against. Keeping it as a lib
# lets us unit-test platform modules without spawning the full app window.
[lib]
name = "jarvis_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-autostart = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.31"

[profile.release]
codegen-units = 1
lto = true
strip = true